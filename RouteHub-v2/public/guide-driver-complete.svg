<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .header { fill: #0f1d35; }
      .card { fill: #fff; stroke: #dde5ee; stroke-width: 1; }
      .text-dark { fill: #0f1d35; font-family: system-ui; font-size: 12px; }
      .text-muted { fill: #667892; font-family: system-ui; font-size: 10px; }
      .text-white { fill: #fff; font-family: system-ui; font-size: 13px; font-weight: 700; }
      .blue { fill: #1667f2; }
      .success { fill: #2ecc71; }
    </style>
  </defs>

  <rect width="320" height="500" class="bg"/>

  <!-- Header -->
  <rect width="320" height="48" class="header"/>
  <circle cx="24" cy="24" r="12" fill="#1667f2"/>
  <text x="160" y="32" class="text-white" text-anchor="middle" font-weight="700">Completar</text>

  <!-- Form Title -->
  <text x="16" y="80" class="text-dark" font-weight="700" font-size="14">Entregar a: Juan García</text>
  <text x="16" y="95" class="text-muted" font-size="10">Calle Principal, 123</text>

  <!-- Form Section -->
  <rect x="12" y="110" width="296" height="240" class="card" rx="8"/>

  <!-- Name Field -->
  <text x="20" y="130" class="text-dark" font-weight="700" font-size="11">NOMBRE</text>
  <rect x="20" y="140" width="280" height="36" fill="none" stroke="#dde5ee" stroke-width="1" rx="6"/>
  <text x="28" y="162" class="text-muted" font-size="11">Nombre de quien recibe</text>

  <!-- Photo Section -->
  <text x="20" y="200" class="text-dark" font-weight="700" font-size="11">FOTO (OPCIONAL)</text>
  <rect x="20" y="210" width="280" height="60" fill="none" stroke="#dde5ee" stroke-width="2" stroke-dasharray="4" rx="6"/>
  <circle cx="160" cy="240" r="12" fill="#1667f2"/>
  <line x1="160" y1="230" x2="160" y2="250" stroke="#1667f2" stroke-width="2"/>
  <line x1="150" y1="240" x2="170" y2="240" stroke="#1667f2" stroke-width="2"/>

  <!-- Buttons -->
  <rect x="20" y="380" width="280" height="40" class="blue" rx="8"/>
  <text x="160" y="405" class="text-white" text-anchor="middle" font-weight="700">Confirmar Entrega</text>

  <rect x="20" y="430" width="280" height="40" fill="none" stroke="#dde5ee" stroke-width="1" rx="8"/>
  <text x="160" y="455" class="blue" text-anchor="middle" font-weight="600">Reportar Incidencia</text>
</svg>