<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .header { fill: #0b1f3a; }
      .card { fill: #fff; stroke: #dde5ee; stroke-width: 1; }
      .text-dark { fill: #0f1d35; font-family: system-ui; font-size: 12px; }
      .text-muted { fill: #667892; font-family: system-ui; font-size: 10px; }
      .text-white { fill: #fff; font-family: system-ui; font-size: 13px; font-weight: 700; }
      .blue { fill: #1667f2; }
      .input { fill: none; stroke: #dde5ee; stroke-width: 1; }
    </style>
  </defs>

  <rect width="320" height="500" class="bg"/>

  <!-- Header -->
  <rect width="320" height="48" class="header"/>
  <text x="16" y="32" class="text-white">Create Route</text>

  <!-- Form Labels and Inputs -->
  <text x="16" y="72" class="text-dark" font-weight="700" font-size="11">TYPE</text>

  <rect x="16" y="82" width="85" height="32" class="card" rx="6"/>
  <text x="25" y="105" class="text-dark" font-weight="600" font-size="11">Pickup</text>

  <rect x="112" y="82" width="85" height="32" class="card" rx="6" stroke="#1667f2" stroke-width="2"/>
  <text x="121" y="105" class="blue" font-weight="600" font-size="11">Delivery</text>

  <rect x="208" y="82" width="85" height="32" class="card" rx="6"/>
  <text x="217" y="105" class="text-dark" font-weight="600" font-size="11">Return</text>

  <!-- Origin -->
  <text x="16" y="140" class="text-dark" font-weight="700" font-size="11">ORIGIN</text>
  <rect x="16" y="150" width="288" height="36" class="input" rx="6"/>
  <text x="24" y="172" class="text-muted" font-size="11">Origin address</text>

  <!-- Destination -->
  <text x="16" y="210" class="text-dark" font-weight="700" font-size="11">DESTINATION</text>
  <rect x="16" y="220" width="288" height="36" class="input" rx="6"/>
  <text x="24" y="242" class="text-muted" font-size="11">Destination address</text>

  <!-- Driver -->
  <text x="16" y="280" class="text-dark" font-weight="700" font-size="11">DRIVER</text>
  <rect x="16" y="290" width="288" height="36" class="input" rx="6"/>
  <text x="24" y="312" class="text-muted" font-size="11">Select driver</text>

  <!-- Map Preview -->
  <rect x="16" y="340" width="288" height="100" class="card" rx="8"/>
  <text x="24" y="355" class="text-dark" font-weight="700" font-size="11">Preview</text>
  <line x1="24" y1="365" x2="292" y2="365" stroke="#dde5ee" stroke-width="1"/>
  <circle cx="100" cy="400" r="3" class="blue"/>
  <circle cx="240" cy="420" r="3" fill="#2ecc71"/>
  <line x1="100" y1="400" x2="240" y2="420" stroke="#1667f2" stroke-width="2" stroke-dasharray="4"/>

  <!-- Submit Button -->
  <rect x="16" y="450" width="288" height="40" class="blue" rx="8"/>
  <text x="160" y="475" class="text-white" text-anchor="middle" font-weight="700">Create Route</text>
</svg>
