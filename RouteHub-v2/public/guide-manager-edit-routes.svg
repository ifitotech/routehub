<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .header { fill: #0b1f3a; }
      .card { fill: #fff; stroke: #dde5ee; stroke-width: 1; }
      .text-dark { fill: #0f1d35; font-family: system-ui; font-size: 12px; }
      .text-muted { fill: #667892; font-family: system-ui; font-size: 10px; }
      .text-white { fill: #fff; font-family: system-ui; font-size: 13px; font-weight: 700; }
      .blue { fill: #1667f2; }
      .btn-small { fill: #eaf2ff; }
    </style>
  </defs>

  <rect width="320" height="500" class="bg"/>

  <!-- Header -->
  <rect width="320" height="48" class="header"/>
  <text x="16" y="32" class="text-white">Manejar Rutas</text>

  <!-- Info -->
  <text x="16" y="72" class="text-muted" font-size="10">Solo rutas activas</text>

  <!-- Route Cards -->
  <!-- Route 1 -->
  <rect x="12" y="90" width="296" height="70" class="card" rx="8"/>
  <rect x="20" y="98" width="280" height="1" fill="#dde5ee"/>
  <text x="20" y="115" class="text-dark" font-weight="700">Ruta #001</text>
  <text x="20" y="128" class="text-muted" font-size="10">Calle Principal → Centro Dist.</text>
  <text x="20" y="141" class="text-muted" font-size="10">Driver: Juan Pérez</text>
  <rect x="240" y="100" width="52" height="24" class="btn-small" rx="4"/>
  <text x="266" y="117" class="blue" text-anchor="middle" font-weight="600" font-size="10">Editar</text>

  <!-- Route 2 -->
  <rect x="12" y="170" width="296" height="70" class="card" rx="8"/>
  <text x="20" y="187" class="text-dark" font-weight="700">Ruta #002</text>
  <text x="20" y="200" class="text-muted" font-size="10">Avenida Central → Sucursal Sur</text>
  <text x="20" y="213" class="text-muted" font-size="10">Driver: Maria García</text>
  <rect x="240" y="180" width="52" height="24" class="btn-small" rx="4"/>
  <text x="266" y="197" class="blue" text-anchor="middle" font-weight="600" font-size="10">Editar</text>

  <!-- Route 3 -->
  <rect x="12" y="250" width="296" height="70" class="card" rx="8"/>
  <text x="20" y="267" class="text-dark" font-weight="700">Ruta #003</text>
  <text x="20" y="280" class="text-muted" font-size="10">Parque Industrial → Centro</text>
  <text x="20" y="293" class="text-muted" font-size="10">Driver: Carlos López</text>
  <rect x="240" y="260" width="52" height="24" class="btn-small" rx="4"/>
  <text x="266" y="277" class="blue" text-anchor="middle" font-weight="600" font-size="10">Editar</text>

  <!-- Empty State Message -->
  <text x="160" y="385" class="text-muted" text-anchor="middle" font-size="11">Las rutas programadas</text>
  <text x="160" y="400" class="text-muted" text-anchor="middle" font-size="11">aparecerán aquí</text>
</svg>