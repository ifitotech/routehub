<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .header { fill: #0b1f3a; }
      .card { fill: #fff; stroke: #dde5ee; stroke-width: 1; }
      .text-dark { fill: #0f1d35; font-family: system-ui; font-size: 12px; }
      .text-muted { fill: #667892; font-family: system-ui; font-size: 10px; }
      .text-white { fill: #fff; font-family: system-ui; font-size: 13px; font-weight: 700; }
      .blue { fill: #1667f2; }
      .toggle-on { fill: #1667f2; }
      .toggle-off { fill: #dde5ee; }
    </style>
  </defs>

  <rect width="320" height="500" class="bg"/>

  <!-- Header -->
  <rect width="320" height="48" class="header"/>
  <text x="16" y="32" class="text-white">Ajustes</text>

  <!-- Section: Cuenta -->
  <rect x="12" y="65" width="296" height="75" class="card" rx="8"/>
  <text x="20" y="80" class="text-dark" font-weight="700" font-size="11">CUENTA</text>
  <line x1="20" y1="87" x2="300" y2="87" stroke="#dde5ee" stroke-width="1"/>

  <text x="20" y="105" class="text-dark" font-size="12">Perfil</text>
  <text x="288" y="105" class="text-muted" font-size="10" text-anchor="end">›</text>

  <text x="20" y="125" class="text-dark" font-size="12">Idioma</text>
  <text x="288" y="125" class="text-muted" font-size="10" text-anchor="end">›</text>

  <!-- Section: Empresa -->
  <rect x="12" y="150" width="296" height="95" class="card" rx="8"/>
  <text x="20" y="165" class="text-dark" font-weight="700" font-size="11">EMPRESA</text>
  <line x1="20" y1="172" x2="300" y2="172" stroke="#dde5ee" stroke-width="1"/>

  <text x="20" y="190" class="text-dark" font-size="12">Nombre de empresa</text>
  <text x="288" y="190" class="text-muted" font-size="10" text-anchor="end">›</text>

  <text x="20" y="210" class="text-dark" font-size="12">Dirección</text>
  <text x="288" y="210" class="text-muted" font-size="10" text-anchor="end">›</text>

  <text x="20" y="230" class="text-dark" font-size="12">Equipo</text>
  <text x="288" y="230" class="text-muted" font-size="10" text-anchor="end">›</text>

  <!-- Section: Notificaciones -->
  <rect x="12" y="255" width="296" height="65" class="card" rx="8"/>
  <text x="20" y="270" class="text-dark" font-weight="700" font-size="11">NOTIFICACIONES</text>
  <line x1="20" y1="277" x2="300" y2="277" stroke="#dde5ee" stroke-width="1"/>

  <text x="20" y="295" class="text-dark" font-size="12">Alertas de rutas</text>
  <rect x="268" y="284" width="32" height="18" class="toggle-on" rx="9"/>
  <circle cx="280" cy="293" r="6" fill="#fff"/>

  <!-- Section: Ayuda -->
  <rect x="12" y="330" width="296" height="60" class="card" rx="8"/>
  <text x="20" y="345" class="text-dark" font-weight="700" font-size="11">AYUDA</text>
  <line x1="20" y1="352" x2="300" y2="352" stroke="#dde5ee" stroke-width="1"/>

  <text x="20" y="370" class="text-dark" font-size="12">Guía</text>
  <text x="288" y="370" class="text-muted" font-size="10" text-anchor="end">›</text>

  <text x="20" y="385" class="text-dark" font-size="12">Contactar soporte</text>
  <text x="288" y="385" class="text-muted" font-size="10" text-anchor="end">›</text>
</svg>