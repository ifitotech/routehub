<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .header { fill: #0f1d35; }
      .card { fill: #fff; stroke: #dde5ee; stroke-width: 1; }
      .text-dark { fill: #0f1d35; font-family: system-ui; font-size: 12px; }
      .text-muted { fill: #667892; font-family: system-ui; font-size: 10px; }
      .text-white { fill: #fff; font-family: system-ui; font-size: 13px; font-weight: 700; }
      .blue { fill: #1667f2; }
      .toggle-on { fill: #1667f2; }
    </style>
  </defs>

  <rect width="320" height="500" class="bg"/>

  <!-- Header -->
  <rect width="320" height="48" class="header"/>
  <circle cx="24" cy="24" r="12" fill="#1667f2"/>
  <text x="160" y="32" class="text-white" text-anchor="middle" font-weight="700">Ajustes</text>

  <!-- Driving Day -->
  <rect x="12" y="65" width="296" height="65" class="card" rx="8"/>
  <text x="20" y="80" class="text-dark" font-weight="700">Jornada de Conducción</text>
  <text x="20" y="95" class="text-muted" font-size="10">Activa el GPS para comenzar</text>

  <rect x="268" y="72" width="32" height="18" class="toggle-on" rx="9"/>
  <circle cx="280" cy="81" r="6" fill="#fff"/>

  <!-- Location Permission -->
  <rect x="12" y="140" width="296" height="65" class="card" rx="8"/>
  <text x="20" y="155" class="text-dark" font-weight="700">Ubicación</text>
  <text x="20" y="170" class="text-muted" font-size="10">Permiso del navegador</text>
  <text x="20" y="193" class="blue" font-size="10" font-weight="600">Permitido</text>

  <!-- Notifications -->
  <rect x="12" y="215" width="296" height="65" class="card" rx="8"/>
  <text x="20" y="230" class="text-dark" font-weight="700">Notificaciones</text>
  <text x="20" y="245" class="text-muted" font-size="10">Avisos de asignaciones</text>
  <text x="20" y="268" class="blue" font-size="10" font-weight="600">Permitido</text>

  <!-- Theme -->
  <rect x="12" y="290" width="296" height="65" class="card" rx="8"/>
  <text x="20" y="305" class="text-dark" font-weight="700">Tema</text>
  <text x="20" y="320" class="text-muted" font-size="10">Seleccionar tema</text>
  <text x="288" y="310" class="text-muted" font-size="10" text-anchor="end">›</text>

  <!-- Help -->
  <rect x="12" y="365" width="296" height="40" class="card" rx="8"/>
  <text x="20" y="390" class="text-dark" font-weight="700" font-size="12">Ayuda y Soporte</text>
  <text x="288" y="390" class="text-muted" font-size="10" text-anchor="end">›</text>
</svg>