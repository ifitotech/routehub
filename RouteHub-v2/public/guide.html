<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía RouteHub</title>
<meta name="description" content="Manual paso a paso para usar RouteHub, con guías separadas para Manager y para Driver.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#f7f9fc; --surface:#ffffff; --surface-2:#eef3f9;
  --ink:#0f1d35; --muted:#5b6d85; --border:#dde5ee;
  --blue:#1667f2; --blue-soft:#eaf2ff; --blue-ink:#0d4fc4;
  --success:#147a4a; --success-soft:#eafbf1; --success-border:#bfead2;
  --warn:#a96800; --warn-soft:#fff6e6; --warn-border:#f3ddac;
  --danger:#b42318; --danger-soft:#fff0f0; --danger-border:#f3b5b5;
  --line-dot:#c7d3e2; --header-bg:#0f1d35;
  --shadow: 0 10px 30px rgba(15,29,53,.08);
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101c2d; --surface:#18263b; --surface-2:#16233a;
    --ink:#f4f7fb; --muted:#b6c4d7; --border:#31445f;
    --blue:#6ea5ff; --blue-soft:#17345c; --blue-ink:#bcd8ff;
    --success:#8fe7bc; --success-soft:#153a2b; --success-border:#1f5b41;
    --warn:#ffd08a; --warn-soft:#3a2c12; --warn-border:#5c451c;
    --danger:#ffc1c6; --danger-soft:#4a252b; --danger-border:#80424d;
    --line-dot:#3a4c68; --header-bg:#0b1526;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101c2d; --surface:#18263b; --surface-2:#16233a;
  --ink:#f4f7fb; --muted:#b6c4d7; --border:#31445f;
  --blue:#6ea5ff; --blue-soft:#17345c; --blue-ink:#bcd8ff;
  --success:#8fe7bc; --success-soft:#153a2b; --success-border:#1f5b41;
  --warn:#ffd08a; --warn-soft:#3a2c12; --warn-border:#5c451c;
  --danger:#ffc1c6; --danger-soft:#4a252b; --danger-border:#80424d;
  --line-dot:#3a4c68; --header-bg:#0b1526;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink)}
p{margin:0}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.top{background:var(--header-bg);color:#fff;padding-block:22px 60px}
.top .wrap{position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(22,103,242,.25)}
.brand em{font-style:normal;color:#9cc0ff}
.top h1{color:#fff;font-size:clamp(28px,5vw,40px);margin:22px 0 8px;text-wrap:balance}
.top p.lead{color:#c3d2e8;font-size:15px;max-width:56ch}
.top .meta{margin-top:16px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#8ea3c2;font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* ---------- switch bars ---------- */
.switchBar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 0}
.switchRow{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:-42px;flex-wrap:wrap}
.switch{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px;width:max-content}
.switch button{appearance:none;border:0;background:transparent;font:inherit;font-family:Manrope,sans-serif;font-weight:800;font-size:13px;padding:9px 20px;border-radius:999px;color:var(--muted);cursor:pointer;transition:background-color .18s ease,color .18s ease,box-shadow .18s ease;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(22,103,242,.35)}
.switch.lang button{padding:9px 14px}
@media(max-width:560px){.switchRow{margin-top:-34px;gap:8px}.switch button{padding:8px 14px;font-size:12px}.switch.lang button{padding:8px 11px}}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;padding-block:36px 60px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.toc{position:sticky;top:70px;display:grid;gap:2px}
.toc a{display:block;padding:8px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:700}
.toc a:hover{background:var(--surface-2);color:var(--ink)}
.toc a.tocActive{background:var(--blue-soft);color:var(--blue-ink)}
@media(max-width:760px){.toc{position:static;display:flex;overflow-x:auto;gap:8px;padding-bottom:6px;-webkit-overflow-scrolling:touch}.toc a{flex:0 0 auto;background:var(--surface);border:1px solid var(--border)}}

.pane{display:grid;gap:34px}
.pane[hidden]{display:none}

/* ---------- step timeline ---------- */
.step{position:relative;padding-left:52px;scroll-margin-top:80px}
.step::before{content:'';position:absolute;left:19px;top:44px;bottom:-34px;width:2px;background:repeating-linear-gradient(to bottom,var(--line-dot) 0 4px,transparent 4px 9px)}
.step:last-child::before{display:none}
.marker{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.screenTag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);background:var(--blue-soft);border-radius:999px;padding:4px 10px 4px 8px;margin-bottom:8px}
.step h2{font-size:20px;margin:0 0 6px}
.step > p.desc{color:var(--muted);font-size:14.5px;max-width:64ch;margin-bottom:14px}
.stepBody{display:grid;gap:16px}
@media(min-width:700px){.stepBody.withShot{grid-template-columns:1.1fr minmax(210px,240px);align-items:start}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px 20px}
.rows{display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.row svg{flex:0 0 auto;color:var(--blue);margin-top:2px}
.row .t{font-weight:700;font-size:14.5px}
.row .d{color:var(--muted);font-size:13.5px;margin-top:2px}
.pillGroup{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--surface-2)}
.pill.pickup{color:var(--blue-ink);background:var(--blue-soft);border-color:transparent}
.pill.delivery{color:var(--success);background:var(--success-soft);border-color:var(--success-border)}
.pill.return{color:var(--muted);background:var(--surface-2)}
.tip,.warnBox{display:flex;gap:10px;border-radius:var(--radius-md);padding:12px 14px;font-size:13.5px;margin-top:12px}
.tip{background:var(--blue-soft);color:var(--blue-ink)}
.warnBox{background:var(--warn-soft);border:1px solid var(--warn-border);color:var(--warn)}
.tip svg,.warnBox svg{flex:0 0 auto;margin-top:1px}

/* ---------- screen mockups ---------- */
.shot{background:linear-gradient(180deg,var(--surface-2),var(--bg));border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.shot .frame{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;font-family:"Source Sans 3",sans-serif}
.shot .bar{background:var(--header-bg);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.shot .body{padding:10px}
.shot .cap{margin-top:8px;font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.mk-chip{display:inline-flex;align-items:center;font-size:8.5px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--blue-soft);color:var(--blue-ink)}
.mk-line{height:7px;border-radius:4px;background:var(--border)}
.mk-card{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 8px;margin-top:6px}
.mk-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.mk-dot{width:16px;height:16px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.mk-btn{font-size:9px;font-weight:800;text-align:center;border-radius:7px;padding:6px;margin-top:6px}
.mk-btn.primary{background:var(--blue);color:#fff}
.mk-btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--ink)}
.mk-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.mk-cal{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:2px}
.mk-cal div{background:var(--surface-2);border-radius:6px;padding:5px 2px;text-align:center;font-size:8px;font-weight:700;color:var(--muted)}
.mk-cal div.on{background:var(--blue);color:#fff}
.mk-navbar{display:flex;justify-content:space-around;border-top:1px solid var(--border);padding:7px 0;background:var(--surface)}
.mk-navbar span{width:14px;height:14px;border-radius:4px;background:var(--border)}
.mk-navbar span.on{background:var(--blue)}
.mk-map{height:64px;border-radius:8px;margin-top:6px;position:relative;overflow:hidden;background:
  linear-gradient(var(--surface-2),var(--surface-2)),
  repeating-linear-gradient(0deg,transparent 0 11px,var(--border) 11px 12px),
  repeating-linear-gradient(90deg,transparent 0 15px,var(--border) 15px 16px)}
.mk-map .pin{position:absolute;width:9px;height:9px;border-radius:50% 50% 50% 0;background:var(--blue);transform:rotate(-45deg)}

/* ---------- FAQ ---------- */
.faq{border-top:1px solid var(--border);padding-block:44px 60px}
.faqHead{margin-bottom:20px}
.faqGrid{display:grid;gap:10px}
details.q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
details.q summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-size:14.5px}
details.q summary::-webkit-details-marker{display:none}
details.q summary .chev{transition:transform .18s ease;color:var(--muted);flex:0 0 auto}
details.q[open] summary .chev{transform:rotate(180deg)}
details.q .a{padding:0 16px 16px;color:var(--muted);font-size:13.5px;max-width:66ch}
details.q .who{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);background:var(--blue-soft);border-radius:999px;padding:3px 8px;margin-right:8px}

footer{border-top:1px solid var(--border);padding-block:26px 50px;color:var(--muted);font-size:12.5px;text-align:center}
footer strong{color:var(--ink)}

@media (prefers-reduced-motion: reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="dot"></span>Route<em>Hub</em></div>
    <h1 id="txt-title"></h1>
    <p class="lead" id="txt-lead"></p>
    <div class="meta">
      <span id="txt-meta1"></span><span id="txt-meta2"></span><span>ES · EN · FR</span>
    </div>
  </div>
</header>

<div class="switchBar">
  <div class="switchRow">
    <div class="switch" role="tablist" id="roleSwitch">
      <button type="button" role="tab" id="tab-manager" onclick="setRole('manager')"></button>
      <button type="button" role="tab" id="tab-driver" onclick="setRole('driver')"></button>
    </div>
    <div class="switch lang" role="tablist" id="langSwitch">
      <button type="button" role="tab" data-lang="es" onclick="setLang('es')">ES</button>
      <button type="button" role="tab" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" role="tab" data-lang="fr" onclick="setLang('fr')">FR</button>
    </div>
  </div>
</div>

<div class="wrap layout">
  <nav class="toc" id="toc" aria-label="Contents"></nav>
  <main class="pane" id="pane-content"></main>
</div>

<section class="faq wrap">
  <div class="faqHead">
    <h2 style="font-size:22px" id="faq-title"></h2>
    <p style="color:var(--muted);font-size:14px;margin-top:4px" id="faq-sub"></p>
  </div>
  <div class="faqGrid" id="faq-grid"></div>
</section>

<footer id="footer-text"></footer>

<script>
/* ============================================================
   Icons (small inline monoline set, no external library)
============================================================ */
var ICON = {
  calendar:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/>',
  split:'<rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="18" rx="1.5"/><path d="M6 8l0 0M17 8l1.5 1.5L21 7"/>',
  search:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  pin:'<path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  pin2:'<path d="M21 10c0 6-9 12-9 12S3 16 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  truckBox:'<rect x="1" y="8" width="13" height="8" rx="1"/><path d="M14 11h4l3 3v2h-7z"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  truck:'<path d="M3 22V12l4-8h10l4 8v10"/><path d="M3 12h18"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-3-3z"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.5 2.1L8 10.1a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .5 3 .7a2 2 0 0 1 1.6 2z"/>',
  star:'<path d="M12 2l2.9 6.3L21 9.2l-4.5 4.4L17.6 21 12 17.8 6.4 21l1.1-7.4L3 9.2l6.1-.9L12 2z"/>',
  warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  box:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  house:'<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  route:'<path d="M6 3l14 9-14 9V3z"/>',
  list:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>'
}
function svg(name){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+ICON[name]+'</svg>'}
function svgSm(name){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+ICON[name]+'</svg>'}

/* ============================================================
   Screen mockups - small illustrations of the real screens,
   built with the app's own colors/shapes (no photo available
   behind login), captions come from the current language pack.
============================================================ */
var MOCK = {
  dashboard: function(L){
    return '<div class="shot"><div class="frame">'+
      '<div class="bar"><span>ROUTEHUB</span><span class="mk-chip">'+L.mkToday+'</span></div>'+
      '<div class="body">'+
        '<div class="mk-cal"><div>L</div><div class="on">M</div><div>M</div><div>J</div><div>V</div></div>'+
        '<div class="mk-card"><div class="mk-line" style="width:60%"></div><div class="mk-row"><span class="mk-dot"></span><div style="flex:1"><div class="mk-line" style="width:80%"></div><div class="mk-line" style="width:40%;margin-top:4px"></div></div></div></div>'+
        '<div class="mk-card"><div class="mk-row"><span class="mk-dot" style="background:var(--success)"></span><div style="flex:1"><div class="mk-line" style="width:70%"></div></div></div></div>'+
      '</div></div>'+
      '<p class="cap">'+L.mkDashboardCap+'</p></div>'
  },
  newroute: function(L){
    return '<div class="shot"><div class="frame">'+
      '<div class="bar"><span>'+L.mkNewRoute+'</span><span class="mk-chip">3/3</span></div>'+
      '<div class="body">'+
        '<div class="mk-grid3"><div class="mk-btn ghost">'+L.mkBranch+'</div><div class="mk-btn primary">'+L.mkLast+'</div><div class="mk-btn ghost">'+L.mkCustom+'</div></div>'+
        '<div class="mk-card"><div class="mk-line" style="width:50%"></div><div class="mk-line" style="width:75%;margin-top:5px"></div></div>'+
        '<div class="mk-btn primary" style="margin-top:10px">'+L.mkAssign+'</div>'+
      '</div></div>'+
      '<p class="cap">'+L.mkNewRouteCap+'</p></div>'
  },
  todayBefore: function(L){
    return '<div class="shot"><div class="frame">'+
      '<div class="bar"><span>'+L.mkToday+'</span><span class="mk-chip">1/6</span></div>'+
      '<div class="body">'+
        '<div class="mk-card"><span class="mk-chip">'+L.mkDelivery+'</span><div class="mk-line" style="width:85%;margin-top:7px"></div><div class="mk-line" style="width:55%;margin-top:5px"></div></div>'+
        '<div class="mk-btn primary" style="margin-top:8px">'+L.mkStart+'</div>'+
      '</div>'+
      '<div class="mk-navbar"><span class="on"></span><span></span><span></span><span></span></div>'+
      '</div><p class="cap">'+L.mkTodayBeforeCap+'</p></div>'
  },
  todayActive: function(L){
    return '<div class="shot"><div class="frame">'+
      '<div class="bar"><span>'+L.mkToday+'</span><span class="mk-chip">1/6</span></div>'+
      '<div class="body">'+
        '<div class="mk-map"><span class="pin" style="left:30%;top:35%"></span><span class="pin" style="left:65%;top:55%;background:var(--success)"></span></div>'+
        '<div class="mk-grid3" style="grid-template-columns:1fr 1fr"><div class="mk-btn ghost">'+L.mkMaps+'</div><div class="mk-btn ghost">'+L.mkCall+'</div></div>'+
        '<div class="mk-btn primary" style="margin-top:6px">'+L.mkArrived+'</div>'+
      '</div></div>'+
      '<p class="cap">'+L.mkTodayActiveCap+'</p></div>'
  },
  settingsDriver: function(L){
    return '<div class="shot"><div class="frame">'+
      '<div class="bar"><span>'+L.mkSettings+'</span></div>'+
      '<div class="body">'+
        '<div class="mk-card"><div class="mk-row"><div style="flex:1"><div class="mk-line" style="width:50%"></div></div><div class="mk-btn ghost" style="width:30px;padding:4px">On</div></div></div>'+
        '<div class="mk-card"><div class="mk-row"><div style="flex:1"><div class="mk-line" style="width:60%"></div></div></div></div>'+
        '<div class="mk-btn ghost" style="margin-top:6px;color:var(--danger)">'+L.mkSignOut+'</div>'+
      '</div></div>'+
      '<p class="cap">'+L.mkSettingsCap+'</p></div>'
  }
}

/* ============================================================
   Content model - one object per language, same shape.
============================================================ */
var CONTENT = {};

CONTENT.es = {
  title:'Guía RouteHub', lead:'Todo lo necesario para operar tu sucursal como Manager o cumplir tus rutas como Driver, pantalla por pantalla.',
  meta1:'2 roles', meta2:'15 pantallas', tabManager:'Soy Manager', tabDriver:'Soy Driver',
  faqTitle:'Preguntas frecuentes', faqSub:'Las mismas dudas que suelen surgir en los primeros días.',

/* ============================================================
   Rendering
============================================================ */
var state = {role:'manager', lang:'es'};

function rowHtml(row){
  return '<div class="row">'+svg(row.icon)+'<div><div class="t">'+row.t+'</div><div class="d">'+row.d+'</div></div></div>';
}

function stepHtml(step, i, L){
  var body = '<div class="rows">' + (step.rows||[]).map(rowHtml).join('') + '</div>';
  if (step.typeRows){
    body += '<div class="card" style="margin-top:12px"><div class="rows">' + step.typeRows.map(function(r){
      return '<div class="row"><span class="pill '+r.pill+'">'+r.label+'</span><div class="d" style="margin-top:0">'+r.d+'</div></div>';
    }).join('') + '</div></div>';
  }
  var card = '<div class="card">' + body + '</div>';
  var stepBody = step.mock
    ? '<div class="stepBody withShot">' + card + MOCK[step.mock](L.mk) + '</div>'
    : '<div class="stepBody">' + card + '</div>';
  var extras = '';
  if (step.pills) extras += '<p class="pillGroup"><span class="pill pickup">'+step.pills[0]+'</span><span class="pill delivery">'+step.pills[1]+'</span><span class="pill return">'+step.pills[2]+'</span></p>';
  if (step.pillsPlain) extras += '<div class="card" style="margin-top:12px"><p class="pillGroup" style="margin-top:0">' + step.pillsPlain.map(function(p){return '<span class="pill">'+p+'</span>'}).join('') + '</p>' + (step.note?'<p class="d" style="margin-top:10px">'+step.note+'</p>':'') + '</div>';
  if (step.tip) extras += '<div class="tip">'+svgSm('star')+'<span>'+step.tip+'</span></div>';
  if (step.warn) extras += '<div class="warnBox">'+svgSm('warn')+'<span>'+step.warn+'</span></div>';
  return '<section class="step" id="step-'+i+'">'+
    '<div class="marker">'+(i+1)+'</div>'+
    '<span class="screenTag">'+step.tag+'</span>'+
    '<h2>'+step.title+'</h2>'+
    '<p class="desc">'+step.desc+'</p>'+
    stepBody + extras +
    '</section>';
}

function render(){
  var L = CONTENT[state.lang];
  document.documentElement.lang = state.lang;
  document.getElementById('txt-title').textContent = L.title;
  document.getElementById('txt-lead').textContent = L.lead;
  document.getElementById('txt-meta1').textContent = L.meta1;
  document.getElementById('txt-meta2').textContent = L.meta2;
  document.getElementById('tab-manager').textContent = L.tabManager;
  document.getElementById('tab-driver').textContent = L.tabDriver;
  document.getElementById('tab-manager').setAttribute('aria-pressed', state.role === 'manager');
  document.getElementById('tab-driver').setAttribute('aria-pressed', state.role === 'driver');
  document.querySelectorAll('#langSwitch button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === state.lang); });
  document.getElementById('faq-title').textContent = L.faqTitle;
  document.getElementById('faq-sub').textContent = L.faqSub;
  document.getElementById('footer-text').innerHTML = L.footer;

  var steps = L[state.role];
  var pane = document.getElementById('pane-content');
  pane.innerHTML = steps.map(function(s,i){ return stepHtml(s, i, L); }).join('');

  var toc = document.getElementById('toc');
  toc.innerHTML = steps.map(function(s,i){ return '<a href="#step-'+i+'">'+s.title+'</a>'; }).join('') +
    '<a href="#" id="toc-faq">'+L.faqTitle+'</a>';
  document.getElementById('toc-faq').onclick = function(e){ e.preventDefault(); document.querySelector('.faq').scrollIntoView({behavior:'smooth'}); };

  var chevron = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  var faqGrid = document.getElementById('faq-grid');
  faqGrid.innerHTML = L.faq.map(function(item){
    return '<details class="q"><summary><span><span class="who">'+L.faqLabels[item.who]+'</span>'+item.q+'</span>'+chevron+'</summary><p class="a">'+item.a+'</p></details>';
  }).join('');

  setupScrollSpy();
  try{ localStorage.setItem('routehub-guide-role', state.role); }catch(e){}
}

function setRole(role){ state.role = role; render(); window.scrollTo({top:0}); }
function setLang(lang){
  // A manual pick here only changes what this guide shows - it never writes
  // back to routehub_language, so it can't affect the app itself.
  manualLangOverride = true;
  state.lang = lang;
  render();
}

// The guide is served from the same origin as the app (public/guide.html),
// so it can read the same localStorage key the app's language switcher
// writes to (see lib/use-preferences.ts: setLocalePreference). This is a
// one-way sync - the app's language wins here unless the visitor
// explicitly picks a different one with the ES/EN/FR buttons above.
var manualLangOverride = false;
function appLocale(){
  var raw = null;
  try{ raw = localStorage.getItem('routehub_language'); }catch(e){}
  return (raw === 'es' || raw === 'en' || raw === 'fr') ? raw : null;
}

var spyObserver = null;
function setupScrollSpy(){
  if (spyObserver) spyObserver.disconnect();
  var links = document.getElementById('toc').querySelectorAll('a');
  spyObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      links.forEach(function(l){ l.classList.remove('tocActive'); });
      var link = document.querySelector('.toc a[href="#' + entry.target.id + '"]');
      if (link) link.classList.add('tocActive');
    });
  }, {rootMargin: '-20% 0px -70% 0px'});
  document.querySelectorAll('#pane-content .step').forEach(function(step){ spyObserver.observe(step); });
}

(function init(){
  try{
    state.role = localStorage.getItem('routehub-guide-role') || 'manager';
  }catch(e){}
  state.lang = appLocale() || 'es';
  render();

  window.addEventListener('storage', function(event){
    if (event.key !== 'routehub_language' || manualLangOverride) return;
    var next = appLocale();
    if (next && next !== state.lang) { state.lang = next; render(); }
  });
})();
</script>
