<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía RouteHub</title>
<meta name="description" content="Guía de RouteHub Manager y Driver, escrita contra la app en vivo del 15 Sep 2026.">
<style>
:root{--bg:#0b1526;--card:#152438;--ink:#f4f7fb;--muted:#9bb0c9;--line:#2a3d59;--blue:#1667F2;--green:#16B96B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:#8cb4ff}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px}
.brand{font-weight:800;letter-spacing:-.03em}
.lead{color:var(--muted);max-width:58ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}
.bar button{border:1px solid var(--line);background:#101c2d;color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p,.card li{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9cc0ff;margin-bottom:8px}
.pane[hidden]{display:none}
footer{margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">RouteHub</p>
  <h1>Guía de la app</h1>
  <p class="lead" id="lead"></p>
  <div class="bar">
    <button type="button" id="tab-m" aria-pressed="true" onclick="show('m')">Manager</button>
    <button type="button" id="tab-d" aria-pressed="false" onclick="show('d')">Driver</button>
    <button type="button" onclick="lang('es')">ES</button>
    <button type="button" onclick="lang('en')">EN</button>
    <button type="button" onclick="lang('fr')">FR</button>
  </div>
  <div id="pane-m" class="pane">
    <article class="card"><span class="tag">Dashboard · /routes</span><h2 id="m1t"></h2><p id="m1"></p></article>
    <article class="card"><span class="tag">Add route</span><h2 id="m2t"></h2><p id="m2"></p></article>
    <article class="card"><span class="tag">Edit routes</span><h2 id="m3t"></h2><p id="m3"></p></article>
    <article class="card"><span class="tag">Settings</span><h2 id="m4t"></h2><p id="m4"></p></article>
  </div>
  <div id="pane-d" class="pane" hidden>
    <article class="card"><span class="tag">Today · /driver</span><h2 id="d1t"></h2><p id="d1"></p></article>
    <article class="card"><span class="tag">Complete</span><h2 id="d2t"></h2><p id="d2"></p></article>
    <article class="card"><span class="tag">Settings</span><h2 id="d3t"></h2><p id="d3"></p></article>
    <article class="card"><span class="tag">GPS</span><h2 id="d4t"></h2><p id="d4"></p></article>
  </div>
  <footer>
    <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/manager/help">Manager help</a> · <a href="/driver/help">Driver help</a><br>
    <span id="foot"></span>
  </footer>
</div>
<script>
var L = {
es:{
lead:'Escrita el 15 Sep 2026 contra la app en vivo (Ces Opa). No usa dibujos viejos.',
m1t:'Ver el día',
m1:'Dashboard muestra el calendario, las rutas asignadas y el mapa del día. Ejemplo en vivo: FOX ELECTRIC, HORSEPOWER y EDSUN. Mañana puede salir en la lista; el mapa solo dibuja el día abierto. En el teléfono usa List / Map.',
m2t:'Crear una ruta',
m2:'Add route abre el formulario al lado del mapa: Pickup, Delivery o Return to branch; conductor; origen (sucursal / última / custom); destino o contacto; horario. El PO sale en Pickup. Delivery pide quién recibe. Return no usa PO.',
m3t:'Mover o cancelar',
m3:'Edit routes es la misma página. Subir, bajar o cancelar solo lo que no está activo o cerrado.',
m4t:'Ajustes',
m4:'Perfil, idioma EN/ES/FR, tema, notificaciones, sucursal, equipo, reportes, guía, privacidad, términos y soporte. Las cuentas @routehub.local no cambian la contraseña aquí.',
d1t:'Hoy',
d1:'Hoy es mapa + ficha. Ejemplo real: Delivery, Stop 1 of 3, FOX ELECTRIC, 6095 NW 167th St. Abajo: Today, Routes, Truck, More. La campana avisa rutas nuevas.',
d2t:'Completar',
d2:'START DELIVERY abre la hoja sobre Hoy. Delivery: nombre de quien recibe y foto. Pickup: confirmar material y PO. Return: sucursal, sin PO. Issue si no se puede cerrar.',
d3t:'Ajustes del driver',
d3:'Perfil, workspace, Driving Day On/Off, compartir ubicación, alertas, guía, privacidad y términos.',
d4t:'GPS',
d4:'Driving Day y el permiso del teléfono son dos interruptores. La PWA no sigue el GPS con la app cerrada. Maps abre Apple o Google con la dirección real.',
foot:'Actualizado 15 Sep 2026 · producto en vivo, no consejo legal.'
},
en:{
lead:'Written 15 Sep 2026 against the live app (Ces Opa).',
m1t:'See the day',
m1:'Dashboard is the calendar, assigned routes and today map. Live example: FOX ELECTRIC, HORSEPOWER, EDSUN. Tomorrow can stay in the list. On a phone use List / Map.',
m2t:'Create a route',
m2:'Add route: Pickup, Delivery or Return to branch; driver; origin; destination; schedule. PO is Pickup only.',
m3t:'Move or cancel',
m3:'Edit routes is the same page. Only open stops can move or cancel.',
m4t:'Settings',
m4:'Profile, language, theme, notifications, branch, team, reports, guide, privacy and terms. @routehub.local accounts cannot change the password here.',
d1t:'Today',
d1:'Map + sheet. Live example: Delivery, Stop 1 of 3, FOX ELECTRIC. Tabs: Today, Routes, Truck, More.',
d2t:'Finish a stop',
d2:'START DELIVERY opens a sheet. Delivery needs recipient and photo. Pickup confirms material. Return has no PO. Use Issue if it cannot close.',
d3t:'Driver settings',
d3:'Driving Day, share location, alerts, guide, privacy and terms.',
d4t:'GPS',
d4:'Driving Day and the phone permission are separate. This PWA cannot keep GPS after you leave the app.',
foot:'Updated 15 Sep 2026 · live product, not legal advice.'
},
fr:{
lead:'Rédigé le 15 Sep 2026 sur l’app réelle (Ces Opa).',
m1t:'Voir la journée',
m1:'Tableau de bord = calendrier, routes et carte du jour.',
m2t:'Créer une route',
m2:'Pickup, Delivery ou Return. PO seulement à la collecte.',
m3t:'Déplacer ou annuler',
m3:'Edit routes sur la même page, arrêts encore ouverts seulement.',
m4t:'Réglages',
m4:'Profil, langue, thème, notifications, guide, confidentialité.',
d1t:'Aujourd’hui',
d1:'Carte + fiche. Onglets : Today, Routes, Truck, More.',
d2t:'Terminer',
d2:'Delivery : destinataire + photo. Return : sans PO.',
d3t:'Réglages driver',
d3:'Driving Day, position, alertes.',
d4t:'GPS',
d4:'Driving Day ≠ permission du téléphone. Pas de GPS appli fermée.',
foot:'15 Sep 2026 · produit réel.'
}
};
function lang(code){var t=L[code];document.documentElement.lang=code;document.getElementById('lead').textContent=t.lead;['m1t','m1','m2t','m2','m3t','m3','m4t','m4','d1t','d1','d2t','d2','d3t','d3','d4t','d4','foot'].forEach(function(id){document.getElementById(id).textContent=t[id]});}
function show(which){document.getElementById('pane-m').hidden=which!=='m';document.getElementById('pane-d').hidden=which!=='d';document.getElementById('tab-m').setAttribute('aria-pressed', which==='m'?'true':'false');document.getElementById('tab-d').setAttribute('aria-pressed', which==='d'?'true':'false');}
lang('es');
</script>
</body>
</html>
